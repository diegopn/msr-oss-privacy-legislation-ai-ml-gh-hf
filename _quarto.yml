project:
  type: website
  output-dir: _site
  pre-render:
    - Rscript main.R --mode prepare-site
  render:
    - /index.qmd
  resources:
    - /site/locales/*.json
    - /site/summary.json
    - /site/site.js
    - /site/favicon.png
website:
  title: Privacidade em OSS de IA/ML
  site-url: https://diegopn.github.io/msr-oss-privacy-legislation-ai-ml-gh-hf/
  favicon: site/favicon.png
  search: false
  navbar:
    title: PRIVACIDADE · IA/ML
    background: light
    pinned: true
    collapse: true
    left:
      - href: "#visao-geral"
        text: Projeto
      - href: "#metodologia"
        text: Método
      - href: "#dados"
        text: Amostra
      - href: "#rq3"
        text: Etapas · RQ3
      - href: "#reproducao"
        text: Execução
      - href: "#limites"
        text: Limites
      - href: "#referencias-metodologicas"
        text: Referências
    right:
      - icon: github
        href: https://github.com/diegopn/msr-oss-privacy-legislation-ai-ml-gh-hf
        aria-label: GitHub
  page-footer:
    left: Pesquisa em engenharia de software
    right: Corte de coleta · 22/09/2026
format:
  html:
    lang: pt-BR
    theme: cosmo
    css: site/styles.css
    toc: true
    toc-title: Nesta página
    include-in-header: site/theme-init.html
    include-after-body:
      text: '<script src="site/site.js" defer></script>'
    code-copy: true
execute:
  enabled: false
