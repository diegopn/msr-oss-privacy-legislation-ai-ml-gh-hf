name: Testes offline
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - name: Install system libraries for R packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes libuv1-dev libcurl4-openssl-dev libssl-dev
      - name: Install R packages
        run: |
          Rscript -e '
          install.packages("pak", repos = "https://cloud.r-project.org")
          pak::pkg_install(c(
            "R6@2.6.1", "yaml@2.3.12", "jsonlite@2.0.0", "httr2@1.3.0",
            "DBI@1.3.0", "RSQLite@3.53.3", "digest@0.6.39",
            "testthat@3.3.2", "cyclocomp@1.1.1"
          ))
          '
      - name: Contratos e testes com APIs simuladas
        run: Rscript scripts/internal.R tests
