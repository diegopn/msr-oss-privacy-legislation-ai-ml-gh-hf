name: Testes offline
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Dependências locais
        run: Rscript main.R --install
      - name: Contratos e testes com APIs simuladas
        run: Rscript main.R --mode test
      - name: Site
        run: quarto render
